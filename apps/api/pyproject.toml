[tool.poetry]
name = "pricegenie-api"
version = "0.1.0"
description = "PriceGenie FastAPI Backend"
authors = ["PriceGenie Team"]

[tool.poetry.dependencies]
python = "^3.11"
fastapi = "^0.109.0"
uvicorn = {extras = ["standard"]}
pydantic = "^2.5.0"
sqlalchemy = "^2.0.25"
python-dotenv = "^1.0.0"
python-jose = {extras = ["cryptography"]}
psycopg2-binary = "^2.9.9"
alembic = "^1.13.0"

[tool.poetry.group.dev.dependencies]
pytest = "^7.4.0"
pytest-asyncio = "^0.21.0"
httpx = "^0.25.0"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
